version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ce49x_postgres
    environment:
      POSTGRES_USER: ce49x_user
      POSTGRES_PASSWORD: ce49x_password
      POSTGRES_DB: ce49x_articles
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ce49x_user -d ce49x_articles"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ce49x_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ce49x.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:

